    label: National Land Cover Database
    provider: USGS / MRLC
    measurementBasis: modelled
    derivesFrom:
      - {variable: SAT.sentinel_landsat, relation: modelled_from, confidence: documented}
    evidence: >
      Decision-tree classification of multi-season 30 m Landsat imagery with
