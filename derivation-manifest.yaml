# ============================================================================
#  derives-from/0.2  —  a dependency manifest for public statistical products
# ============================================================================
#
#  Public data catalogues record isProvidedBy (which file a number arrived in).
#  None record derivesFrom (what the number was computed from). Without that
#  edge, a covariate that is an ancestor of your target is indistinguishable
#  from an independent signal.
#
#  This file is a hand-built, evidence-tagged prototype of the missing edge.
#  It is deliberately incomplete. Every edge carries an honest confidence
#  level, and every product that carries edges records the evidence behind
#  them, because an unaudited lineage graph would reproduce the exact problem
#  it is meant to solve.
#
#  relation:
#    identity        B *is* A, republished under another name
#    component       A is a mathematical ingredient of B
#    modelled_from   A is a covariate in the statistical model producing B
#    poststratified_on  A supplies the population weights B is raked to
#    denominator     A is the denominator when B is expressed as a rate
#
#  measurementBasis:
#    measured        direct enumeration, survey, sensor, or registry
#    modelled        output of a statistical or ML model
#    composite       deterministic arithmetic over other published products
#
#  confidence:
#    certain         formula published, or inputs and outputs ship together
#    documented      stated in the producer's own methodology
#    inferred        strongly implied but not verbatim; treat as provisional
#
#  coPublishedNonInputs:
#    Variables that ship in the SAME FILE as the product and are NOT inputs
#    to it, directly or transitively. Use it sparingly: an entry here tells
#    the linter to CLEAR a covariate, so a wrong entry is a false clearance,
#    which is worse than no linter at all.
#
#    This field has now produced an error in both directions, both from the
#    same habit of reading a delivered file instead of a methodology. v0.1
#    recorded EP_NOINT as a `component` at `certain` when it is not ranked at
#    all. A later pass then over-corrected, listing all eight non-ranked SVI
#    columns here as safe; seven of them sum exactly to EP_MINRTY, which is
#    Theme 3, so they are ancestors of the index two hops up. EP_NOINT is the
#    only member of the eight that genuinely qualifies.
# ============================================================================

schema: derives-from/0.2
generated: 2026-08-30
note: >
  Prototype across US and global public data infrastructure. Coverage is
  illustrative, not exhaustive. Claims removed or rewritten on verification
  are recorded as `correction:` fields rather than deleted silently. Version
  0.2 corrects six errors found by auditing v0.1 against primary sources;
  four of them were in edges v0.1 had marked `certain` or `documented`.
  A later pass fixed one more, of a different kind: seven of the eight entries
  in CDC_SVI.RPL_THEMES.coPublishedNonInputs were written without their `ACS.`
  prefix, so they resolved to no product at all and the near-miss note they
  exist to raise could never fire. They are now defined as products and the
  linter's self-check validates this field too, so it cannot recur silently.

products:

  # ---------------------------------------------------------------- measured
  # The 16 ACS variables that are percentile-ranked into the CDC SVI themes.
  # Verified against the delivered file: SVI 2022 California tract CSV carries
  # 24 EP_* columns but only 16 EPL_* percentile ranks. The 16 below are those.
  ACS.EP_POV150:
    label: Population below 150% of federal poverty level
    provider: US Census Bureau — American Community Survey
    measurementBasis: measured
    isProvidedBy: https://api.census.gov/data/2023/acs/acs5
    derivesFrom: []

  ACS.EP_UNEMP:      {label: Unemployment rate, provider: US Census Bureau, measurementBasis: measured, derivesFrom: []}
  ACS.EP_HBURD:      {label: Housing cost burden, provider: US Census Bureau, measurementBasis: measured, derivesFrom: []}
  ACS.EP_NOHSDP:     {label: No high-school diploma, provider: US Census Bureau, measurementBasis: measured, derivesFrom: []}
  ACS.EP_UNINSUR:    {label: Uninsured, provider: US Census Bureau, measurementBasis: measured, derivesFrom: []}
  ACS.EP_AGE65:      {label: Aged 65 and over, provider: US Census Bureau, measurementBasis: measured, derivesFrom: []}
  ACS.EP_AGE17:      {label: Aged 17 and under, provider: US Census Bureau, measurementBasis: measured, derivesFrom: []}
  ACS.EP_DISABL:     {label: Civilian non-institutionalised population with a disability, provider: US Census Bureau, measurementBasis: measured, derivesFrom: []}
  ACS.EP_SNGPNT:     {label: Single-parent household with children under 18, provider: US Census Bureau, measurementBasis: measured, derivesFrom: []}
  ACS.EP_LIMENG:     {label: Limited-English-speaking household, provider: US Census Bureau, measurementBasis: measured, derivesFrom: []}
  ACS.EP_MINRTY:
    label: Racial and ethnic minority status
    provider: US Census Bureau
    measurementBasis: composite
    derivesFrom:
      - {variable: ACS.EP_AFAM,      relation: component, confidence: certain}
      - {variable: ACS.EP_HISP,      relation: component, confidence: certain}
      - {variable: ACS.EP_ASIAN,     relation: component, confidence: certain}
      - {variable: ACS.EP_AIAN,      relation: component, confidence: certain}
      - {variable: ACS.EP_NHPI,      relation: component, confidence: certain}
      - {variable: ACS.EP_TWOMORE,   relation: component, confidence: certain}
      - {variable: ACS.EP_OTHERRACE, relation: component, confidence: certain}
    evidence: >
      Measured against the delivered file rather than taken from documentation:
      E_MINRTY equals the sum of the seven race and ethnicity counts exactly, in
      all 9,109 California tracts of SVI 2022, with a maximum absolute
      difference of zero. The published EP_ percentages agree to within 0.2
      percentage points, which is rounding. The seven reconstruct EP_MINRTY at
      cross-validated R2 = 0.994 and RPL_THEME3 at R2 = 0.992.
    correction: >
      An earlier pass recorded all seven of these as `coPublishedNonInputs` of
      CDC_SVI.RPL_THEMES, meaning shipped alongside the index and safe to use.
      That was wrong. They are not ranked individually, but they sum exactly to
      EP_MINRTY, which is the sole input to Theme 3, so each of them is an
      ancestor of the overall index two hops up. The linter was therefore
      clearing them as safe covariates for an SVI target, which is a false
      clearance of exactly the kind this tool exists to prevent. Only
      ACS.EP_NOINT remains a genuine co-published non-input: it reaches
      RPL_THEMES at R2 = 0.384 on its own, which is correlation, and it is a
      component of no ranked SVI variable.
  ACS.EP_MUNIT:      {label: Housing in structures with 10 or more units, provider: US Census Bureau, measurementBasis: measured, derivesFrom: []}
  ACS.EP_MOBILE:     {label: Mobile homes, provider: US Census Bureau, measurementBasis: measured, derivesFrom: []}
  ACS.EP_CROWD:      {label: Unit-level crowding (more people than rooms), provider: US Census Bureau, measurementBasis: measured, derivesFrom: []}
  ACS.EP_NOVEH:      {label: No vehicle available, provider: US Census Bureau, measurementBasis: measured, derivesFrom: []}
  ACS.EP_GROUPQ:     {label: Population in group quarters, provider: US Census Bureau, measurementBasis: measured, derivesFrom: []}

  # Published in the SVI file, but NOT part of the index. See CDC_SVI.RPL_THEMES.
  ACS.EP_NOINT:
    label: No broadband internet access
    provider: US Census Bureau
    measurementBasis: measured
    derivesFrom: []
    comment: >
      An SVI *adjunct* variable: shipped in the same CSV as the index, absent
      from the ranking. It is nonetheless a real ancestor of FEMA's social
      vulnerability layer, via the Census Community Resilience Estimates, which
      does count broadband access among its ten components. Right variable,
      wrong parent — which is precisely why the parent has to be recorded.

