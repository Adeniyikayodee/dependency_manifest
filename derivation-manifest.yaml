  # ----------------------------------------------------- modelled / composite
  CDC_SVI.RPL_THEME1:
    label: SVI Theme 1 — Socioeconomic Status percentile rank
    provider: CDC / ATSDR
    measurementBasis: composite
    isProvidedBy: https://svi.cdc.gov/
    derivesFrom:
      - {variable: ACS.EP_POV150,   relation: component, confidence: certain}
      - {variable: ACS.EP_UNEMP,    relation: component, confidence: certain}
      - {variable: ACS.EP_HBURD,    relation: component, confidence: certain}
      - {variable: ACS.EP_NOHSDP,   relation: component, confidence: certain}
      - {variable: ACS.EP_UNINSUR,  relation: component, confidence: certain}
    evidence: >
      Defined as the percentile rank of the summed percentile ranks of these
      five ACS variables. The published state CSVs carry the EP_* inputs and
      the RPL_* outputs in the same file. Reconstructed from its own inputs at
      cross-validated R2 = 0.998 (9,041 California tracts, SVI 2022, five-fold
      HistGradientBoostingRegressor; see reproduce_svi.py). Figures are quoted
      to three decimals because the fourth moves with the scikit-learn version;
      they are stable across 1.3.2 to 1.9.0.
    correction: >
      v0.1 described this theme using the SVI 2018 variable set in places. The
      five variables above are the SVI 2020/2022 set, confirmed against the
      delivered file: EP_HBURD is present, and no per-capita-income column
      exists in SVI 2020 or later.

  CDC_SVI.RPL_THEME2:
    label: SVI Theme 2 — Household Characteristics percentile rank
    provider: CDC / ATSDR
    measurementBasis: composite
    derivesFrom:
      - {variable: ACS.EP_AGE65,  relation: component, confidence: certain}
      - {variable: ACS.EP_AGE17,  relation: component, confidence: certain}
      - {variable: ACS.EP_DISABL, relation: component, confidence: certain}
      - {variable: ACS.EP_SNGPNT, relation: component, confidence: certain}
      - {variable: ACS.EP_LIMENG, relation: component, confidence: certain}
    evidence: >
      Percentile rank of the summed percentile ranks of these five ACS
      variables. CDC's SVI documentation assigns these five to Theme 2, and
      the delivered file carries one EPL_* column for each, so inputs and
      outputs ship together and the edge is checkable without leaving the
      CSV. Reconstructed from its own inputs at cross-validated
      R2 = 0.992 (9,042 California tracts, SVI 2022; see reproduce_svi.py).

  CDC_SVI.RPL_THEME3:
    label: SVI Theme 3 — Racial and Ethnic Minority Status percentile rank
    provider: CDC / ATSDR
    measurementBasis: composite
    derivesFrom:
      - {variable: ACS.EP_MINRTY, relation: component, confidence: certain}
    evidence: >
      Theme 3 is a single-variable theme in SVI 2020 and later: one ranked
      input, EPL_MINRTY. The relationship is an exact rank transform rather
      than an approximation, with a Spearman correlation of 1.000000 between
      EP_MINRTY and RPL_THEME3 across 9,080 California tracts and
      cross-validated R2 = 1.000 from that single input (see
      reproduce_svi.py). This edge is why the seven race and ethnicity
      columns that sum to E_MINRTY are ancestors of the overall index two
      hops up rather than bystanders published beside it.

  CDC_SVI.RPL_THEME4:
    label: SVI Theme 4 — Housing Type and Transportation percentile rank
    provider: CDC / ATSDR
    measurementBasis: composite
    derivesFrom:
      - {variable: ACS.EP_MUNIT,  relation: component, confidence: certain}
      - {variable: ACS.EP_MOBILE, relation: component, confidence: certain}
      - {variable: ACS.EP_CROWD,  relation: component, confidence: certain}
      - {variable: ACS.EP_NOVEH,  relation: component, confidence: certain}
      - {variable: ACS.EP_GROUPQ, relation: component, confidence: certain}
    evidence: >
      Percentile rank of the summed percentile ranks of these five ACS
      variables. CDC's SVI documentation assigns these five to Theme 4, and
      the delivered file carries one EPL_* column for each, so inputs and
      outputs ship together and the edge is checkable without leaving the
      CSV. Reconstructed from its own inputs at cross-validated
      R2 = 0.996 (9,042 California tracts, SVI 2022; see reproduce_svi.py).

  CDC_SVI.RPL_THEMES:
    label: SVI overall summary percentile rank
    provider: CDC / ATSDR
    measurementBasis: composite
    derivesFrom:
      - {variable: CDC_SVI.RPL_THEME1, relation: component, confidence: certain}
      - {variable: CDC_SVI.RPL_THEME2, relation: component, confidence: certain}
      - {variable: CDC_SVI.RPL_THEME3, relation: component, confidence: certain}
      - {variable: CDC_SVI.RPL_THEME4, relation: component, confidence: certain}
    coPublishedNonInputs:
      - ACS.EP_NOINT
    evidence: >
      Percentile rank of the summed four theme rankings, themselves composed of
      16 ACS variables. Verified against the delivered file: the SVI 2022
      California tract CSV carries 16 EPL_* percentile-rank columns, one per
      ranked input. Reconstructed from those 16 inputs at cross-validated
      R2 = 0.987 (9,041 tracts; 0.993 with a longer boosting schedule).
    correction: >
      v0.1 recorded ACS.EP_NOINT as a `component` at `certain` confidence and
      described the index as "24 ACS variables". Both were wrong, and from the
      same mistake: counting the 24 EP_* columns delivered in the CSV rather
      than the 16 that are actually ranked. The edge was removed. Note that
      only EP_NOINT of the eight non-ranked columns is a true non-input: it
      predicts RPL_THEMES at R2 = 0.384 alone, against 0.987 for the true
      sixteen, whilst the seven race and ethnicity counts are components of
      EP_MINRTY and are recorded as such. See the correction on ACS.EP_MINRTY.

  CDC_PLACES.tract:
    label: PLACES small-area health prevalence estimates, census tract
    provider: CDC
    measurementBasis: modelled
    isProvidedBy: https://data.cdc.gov/resource/cwsq-ngmh.json
    derivesFrom:
      - {variable: BRFSS,           relation: modelled_from,     confidence: documented}
      - {variable: ACS.EP_POV150,   relation: modelled_from,     confidence: documented}
      - {variable: CENSUS.blocks,   relation: poststratified_on, confidence: documented}
    evidence: >
      Multilevel regression and poststratification. Model covariates are
      individual age, sex, race/ethnicity and education from BRFSS, plus a
      county-level percentage below 150% FPL from the 5-year ACS, with state
      and county random effects, poststratified onto census-block demographics.
      Published values are posterior means, not measurements.

  CENSUS_CRE.social_vulnerability:
    label: Census Community Resilience Estimates — Social Vulnerability Measure
    provider: US Census Bureau — Community Resilience Estimates
    measurementBasis: modelled
    isProvidedBy: https://www.census.gov/programs-surveys/community-resilience-estimates.html
    derivesFrom:
      - {variable: ACS.EP_POV150,  relation: modelled_from,     confidence: documented}
      - {variable: ACS.EP_SNGPNT,  relation: modelled_from,     confidence: documented}
      - {variable: ACS.EP_CROWD,   relation: modelled_from,     confidence: documented}
      - {variable: ACS.EP_LIMENG,  relation: modelled_from,     confidence: documented}
      - {variable: ACS.EP_UNEMP,   relation: modelled_from,     confidence: documented}
      - {variable: ACS.EP_DISABL,  relation: modelled_from,     confidence: documented}
      - {variable: ACS.EP_UNINSUR, relation: modelled_from,     confidence: documented}
      - {variable: ACS.EP_AGE65,   relation: modelled_from,     confidence: documented}
      - {variable: ACS.EP_NOVEH,   relation: modelled_from,     confidence: documented}
      - {variable: ACS.EP_NOINT,   relation: modelled_from,     confidence: documented}
      - {variable: CENSUS.blocks,  relation: poststratified_on, confidence: documented}
    evidence: >
      Small-area estimation over individual and household level ACS internal
      microdata, combined with the Population Estimates Program and decennial
      census population totals (MARC and PPMF files). Ten components of social
      vulnerability, listed verbatim in FEMA National Risk Index Technical
      Documentation v1.20 (December 2025) section 4.1.1: income-to-poverty
      ratio, single or zero caregiver household, unit-level crowding,
      communication barrier, lack of employment, disability, no health
      insurance coverage, aged 65 or older, no vehicle access, and households
      without broadband internet access.
    uncertainty: >
      SCOPED. The ten components are documented and map cleanly onto ACS
      concepts, so the ACS ancestry is solid. The exact ACS table codes behind
      each component are not pinned here, and the CRE model is small-area
      estimation rather than deterministic arithmetic, so these are
      `modelled_from` rather than `component`.

  FEMA_NRI.social_vulnerability:
    label: National Risk Index — Social Vulnerability component
    provider: FEMA
    measurementBasis: composite
    derivesFrom:
      - {variable: CENSUS_CRE.social_vulnerability, relation: identity, confidence: documented}
    evidence: >
      FEMA National Risk Index Technical Documentation v1.20 (December 2025)
      section 4.1.1: "Social Vulnerability source data provider: Census
      Community Resilience Estimates Social Vulnerability Measure." FEMA takes
      the Census raw national percentile and its 90% confidence interval,
      converts the interval to a one-standard-deviation interval under a normal
      approximation, computes a dominance count of how many other communities
      are clearly less vulnerable, and rescales that count to a percentile
      (Appendix E). Ratings are then quintiles of that percentile.
    correction: >
      v0.1 recorded this as an `identity` edge to CDC_SVI.RPL_THEMES, and
      attributed the transform to "FEMA's own scaling and a k-means clustering
      step". Both were wrong against the current release. FEMA's own history
      (section 2) records the sequence: HVRI SoVI, then CDC/ATSDR SVI, then the
      Census CRE Social Vulnerability Measure from v1.20.0 onward. The CDC SVI
      edge describes a superseded vintage. k-means (scikit-learn, n_clusters=5,
      max_iter=500, cube-root transform) is applied to Risk and Expected Annual
      Loss ratings; Social Vulnerability and Community Resilience ratings are
      quintiles.

  HVRI.bric:
    label: Baseline Resilience Indicators for Communities (BRIC), FEMA-modified
    provider: University of South Carolina — Hazards & Vulnerability Research Institute
    measurementBasis: composite
    derivesFrom:
      - {variable: ACS.EP_NOHSDP,            relation: component, confidence: documented}
      - {variable: ACS.EP_AGE65,             relation: component, confidence: documented}
      - {variable: ACS.EP_AGE17,             relation: component, confidence: documented}
      - {variable: ACS.EP_NOVEH,             relation: component, confidence: documented}
      - {variable: ACS.EP_NOINT,             relation: component, confidence: documented}
      - {variable: ACS.EP_LIMENG,            relation: component, confidence: documented}
      - {variable: ACS.EP_DISABL,            relation: component, confidence: documented}
      - {variable: ACS.EP_UNINSUR,           relation: component, confidence: documented}
      - {variable: ACS.tenure_homeownership, relation: component, confidence: documented}
      - {variable: ACS.EP_UNEMP,             relation: component, confidence: documented}
      - {variable: CBP.business_patterns,    relation: component, confidence: documented}
    evidence: >
      BRIC comprises 49 indicators across six types of resilience: social,
      economic, community capital, institutional capacity, housing and
      infrastructure, and environmental (FEMA NRI Technical Documentation v1.20
      section 4.2.1). Appendix F enumerates the Social and Economic pillar
      inputs FEMA recalculates, giving 12 variables from the ACS 5-year
      estimates and 3 from County Business Patterns, with the Census table for
      each: B15003 educational attainment, B01001 pre-retirement age, B25044
      transportation access, DP04 communication capacity, B16001 English
      language competency, B18101 disability status, B27001 health insurance
      coverage, B25003 homeownership, and B23025 employment rate.
    uncertainty: >
      SCOPED. The nine ACS-backed edges above are pinned to named Census tables
      in FEMA's Appendix F, which covers the Social and Economic pillars only.
      The remaining four pillars draw on LEAD tool and County Health Rankings
      data not traced here, so this list is authoritative but not exhaustive.
    correction: >
      v0.1 asserted two `inferred` edges, to ACS.EP_POV150 and ACS.EP_UNEMP, on
      the reasoning that BRIC's primary source is documented as the ACS. The
      employment edge survives. The poverty edge does not: no poverty measure
      appears among the 12 ACS variables in FEMA's Appendix F. The edges are
      now pinned to Census table codes and upgraded to `documented`.

  FEMA_NRI.community_resilience:
    label: National Risk Index — Community Resilience component
    provider: FEMA
    measurementBasis: composite
    derivesFrom:
      - {variable: HVRI.bric, relation: identity, confidence: documented}
    evidence: >
      "Community resilience data are obtained from the University of South
      Carolina's Hazards and Vulnerability Research Institute Baseline
      Resilience Indicators for Communities" (NRI Technical Documentation v1.20
      section 4.2.1). Available at county level only; census tracts inherit
      their parent county's score.
    uncertainty: >
      SCOPED. `identity` describes the source of the score, not a bit-for-bit
      republication. FEMA recalculates the Social and Economic pillars with
      food-insecurity, racial/ethnic income-inequality and gender
      income-inequality inputs removed, then takes national percentiles.

  FEMA_NRI.expected_annual_loss:
    label: National Risk Index — Expected Annual Loss
    provider: FEMA
    measurementBasis: modelled
    derivesFrom: []
    comment: Hazard-frequency and exposure modelling; lineage not traced here.

  FEMA_NRI.risk_score:
    label: National Risk Index — composite Risk Score
    provider: FEMA
    measurementBasis: composite
    derivesFrom:
      - {variable: FEMA_NRI.expected_annual_loss, relation: component, confidence: certain}
      - {variable: FEMA_NRI.social_vulnerability, relation: component, confidence: certain}
      - {variable: FEMA_NRI.community_resilience, relation: component, confidence: certain}
    evidence: >
      NRI Technical Documentation v1.20 (December 2025) sections 3.1 and 4.3,
      Equations 2 and 3. Risk Index Value = Expected Annual Loss x Community
      Risk Factor. The Community Risk Factor is obtained by dividing the Social
      Vulnerability Value by the Community Resilience Value to give a Community
      Risk Ratio, then mapping the national percentile of that ratio onto a
      triangular distribution with minimum 0.5, mode 1, and maximum 2. Ratings
      are assigned by k-means clustering (scikit-learn, n_clusters=5,
      max_iter=500) on cube-root-transformed values.
    correction: >
      v0.1 recorded this edge at `documented` with a PRECISION LIMIT note
      claiming "the exact algebraic form could not be verified directly: FEMA's
      methodology PDFs return HTTP 403 to automated requests", and drew a
      general moral from it. The claim was false. The technical documentation
      PDF returns HTTP 200 to an unauthenticated request and states the formula
      including the triangular distribution parameters. The edges are upgraded
      to `certain` and the moral withdrawn.

  WORLDPOP.gridded_population:
    label: WorldPop gridded population, ~100 m
    provider: WorldPop
    measurementBasis: modelled
    derivesFrom:
      - {variable: SAT.viirs_ntl,        relation: modelled_from, confidence: inferred}
      - {variable: SAT.sentinel_landsat, relation: modelled_from, confidence: inferred}
      - {variable: SAT.glo30_dem,        relation: modelled_from, confidence: inferred}
    evidence: >
      Random-forest dasymetric redistribution of census counts (Stevens et al.
      2015). The published methods page lists the covariate classes as
      "settlement locations, settlement extents, land cover, roads, building
      maps, health facility locations, satellite nightlights, vegetation,
      topography, refugee camps".
    uncertainty: >
      SCOPED. The covariate *classes* are documented; the specific products are
      not. WorldPop names "satellite nightlights", "land cover" and
      "topography" without naming VIIRS, Sentinel/Landsat or GLO-30. The three
      edges above are therefore the manifest's best guess at which product
      fills each class.
    correction: >
      v0.1 carried these three edges at `documented`. That was the same
      standard this manifest refused to accept for HungerMap, where an unnamed
      population-density source got the edge cut. Applying one rule to both,
      these are `inferred`.

  ALPHAEARTH.embeddings:
    label: AlphaEarth Foundations satellite embeddings, 64-dim
    provider: Google DeepMind
    measurementBasis: modelled
    derivesFrom:
      - {variable: SAT.sentinel_landsat, relation: modelled_from, confidence: documented}
      - {variable: SAT.palsar2,          relation: modelled_from, confidence: documented}
      - {variable: SAT.gedi_canopy,      relation: modelled_from, confidence: documented}
      - {variable: SAT.glo30_dem,        relation: modelled_from, confidence: documented}
      - {variable: SAT.era5_land,        relation: modelled_from, confidence: documented}
      - {variable: SAT.grace,            relation: modelled_from, confidence: documented}
      - {variable: NLCD.landcover,       relation: modelled_from, confidence: documented}
    evidence: >
      arXiv:2507.22291 supplement sections S1.1 to S1.12 enumerate the sources:
      Sentinel-2 optical, Sentinel-1 C-band SAR, Landsat optical and thermal,
      ALOS PALSAR-2, ERA5-Land, GEDI, GRACE, GLO-30, NLCD land cover, and text
      sources including Wikipedia and GBIF. Text, Wikipedia and GBIF are not
      modelled as nodes here.
    correction: >
      An earlier version of this manifest listed MODIS NDVI as an input. That
      was wrong. MODIS appears exactly once in arXiv:2507.22291, inside a GLaNCE
      *evaluation* label set, and never as a training source. The edge was
      removed. v0.1 also omitted GRACE and NLCD, which are documented inputs;
      both are now present. NLCD matters in particular, because it makes any
      NLCD-derived land-cover covariate a sibling of AlphaEarth rather than an
      independent modality.

  HUNGERMAP.live:
    label: WFP HungerMap LIVE food-security nowcast
    provider: World Food Programme
    measurementBasis: modelled
    derivesFrom:
      - {variable: SAT.modis_ndvi,        relation: modelled_from, confidence: documented}
      - {variable: SAT.chirps_rainfall,   relation: modelled_from, confidence: documented}
      - {variable: WORLDBANK.food_prices, relation: modelled_from, confidence: documented}
      - {variable: WFP.household_surveys, relation: modelled_from, confidence: documented}
      - {variable: SAT.viirs_ntl,         relation: modelled_from, confidence: inferred}
    evidence: >
      Machine-learning model initially trained on data from 63 countries over a
      14-year period, covering population density, nightlight intensity,
      rainfall, vegetation index, conflict, market prices, macroeconomic
      indicators and undernourishment. Rainfall and vegetation features are
      sourced from WFP's Climate Explorer and originate from CHIRPS and MODIS
      respectively. Primary reference: Foini et al., "Forecasting trends in food
      security with real time data", Communications Earth & Environment, 2024
      (https://www.nature.com/articles/s43247-024-01698-9).
    uncertainty: >
      SCOPED. CHIRPS and MODIS are named explicitly, so those edges are
      documented. "Nightlight intensity" is a documented input whose sensor is
      not named, so the VIIRS edge is `inferred`.
    correction: >
      An earlier version derived this from WorldPop. "Population density" is a
      documented input but its source is not named by WFP, so that edge was
      removed rather than guessed. v0.1 additionally cited the WFP Innovation
      project page as the evidence for the 63-country training set and the
      specific covariate list; that page carries neither. The citation is now
      the peer-reviewed methods paper, which does.

  KUMMU.gridded_gdp:
    label: Gridded GDP per capita
    provider: Kummu et al., Scientific Data 2018
    measurementBasis: modelled
    derivesFrom:
      - {variable: HYDE.population_grid, relation: denominator, confidence: documented}
    evidence: >
      Sub-national GDP per capita (PPP) is population-weighted to national
      totals using the HYDE 3.x gridded population dataset, then redistributed
      onto that grid; higher-resolution years are adapted from the Global Human
      Settlement population grid. Population is the denominator of a per-capita
      quantity, which is what the `denominator` relation records.
    correction: >
      An earlier draft derived this from WorldPop and nighttime lights. Both
      were wrong: the paper contains no reference to nighttime lights, DMSP or
      VIIRS in its own method, and none to WorldPop at all. v0.1 then said "the
      specific population grid was not verified, so no edge is asserted". That
      was over-cautious. The paper names HYDE 3.x and the GHS population grid
      directly, and the edge is now asserted.

  IMD_ENGLAND.overall:
    label: English Index of Multiple Deprivation
    provider: UK Ministry of Housing, Communities and Local Government
    measurementBasis: composite
    derivesFrom:
      - {variable: IMD_ENGLAND.health_domain, relation: component, confidence: documented}
    evidence: >
      Weighted sum of seven domains built from 39 indicators, sub-domain weights
      set by maximum-likelihood factor analysis. Health Deprivation and
      Disability carries 13.5%, alongside Income 22.5%, Employment 22.5%,
      Education 13.5%, and Crime, Barriers to Housing and Services, and Living
      Environment at 9.3% each (Indices of Deprivation 2019 Technical Report,
      chapter 4 and Appendix E).

  IMD_ENGLAND.health_domain:
    label: IMD — Health Deprivation and Disability domain
    provider: UK MHCLG
    measurementBasis: composite
    derivesFrom: []
    comment: >
      Relevant because IMD is routinely used as a covariate to predict health
      outcomes, while containing a health deprivation domain by construction.
